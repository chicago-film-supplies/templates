name: templates-lint

# Six always-on guards on every PR.
#
# 0. LOCKFILE SYNC (scripts/check-lockfile-sync.ts) — do deno.json and deno.lock
#    still agree about what is DIRECTLY wanted? Numbered 0 because its POSITION
#    is the whole of its wiring: every step below resolves @cfs/core from the
#    LOCK, so a pin bumped without a `deno install` leaves them all green and
#    correctly answering about a version this repo has stopped claiming to use.
#    templates#243 is the incident — a pin bumped with the lock left behind,
#    merged with every check green.
#
#    🔴 It must be the FIRST deno invocation in the job, and a bare `deno run`
#    rather than a `deno task`. Measured 2026-09-07: `deno task X` resolves the
#    import map and REWRITES deno.lock in the launcher before X starts, so one
#    earlier `deno task` repairs the desync in the runner and this guard then
#    reports it no more. See scripts/check-lockfile-sync.ts for the three-way
#    isolation.
#
# 1. FIXTURES (scripts/lint-fixtures.ts) — every fixtures/<gp>/*.json must satisfy
#    the same schema the API enforces on save, and carry no customer PII. Fixtures
#    used to be validated ONLY on the API's write path, so a fixture committed
#    straight to git bypassed the only gate there was: both quote fixtures sat
#    invalid in main for months, rendering fine, and only exploded when an operator
#    tried to save an edit — reporting a wall of failures they had not caused. One
#    of them was also a verbatim copy of a live customer's order.
#
# 2. TEMPLATES — .eta sources must pull contact info from `it.doc`, never hardcode
#    customer PII. A STARTING HEURISTIC: it catches the obvious cases (a literal
#    customer email or phone pasted into a template), not every conceivable PII
#    shape; tune the patterns as real false-positives/negatives surface.
#
# 3. CITATIONS — documented at its own step below, where the CI-checkout caveat
#    that matters most about it lives.
#
# 4. DEPLOYED ENUMS (scripts/lint-deployed-enums.ts) — every sidecar's
#    collection_source / collection_target / surfaces must name a member the
#    DEPLOYED api-cloudrun's core actually has. The other guards resolve
#    against this repo's PIN, which is right for what they check but
#    structurally blind to this: the publish webhook validates a merged sidecar
#    against prod's deployed core, and the deployed version is not a fact this
#    repository holds at all. Twice — #155 and #199, a week apart — a PR merged
#    green on every required check and 500'd the webhook, rolling the whole
#    publish back.
#
# 5. CAPTURE FLOOR (scripts/lint-capture-floor.ts) — capture-floor.json's
#    min_core must still cover every `pii: "mask"` tag that EXISTS in a
#    published @cfs/core. api-cloudrun#838's guard refuses a capture when the
#    DEPLOYED build is below the floor; it cannot see the floor itself falling
#    behind the masks, and a missing mask does not fail loudly — it writes real
#    customer data into git, where nothing can recall it (templates#213).
#
# ⚠️ **4 and 5 are the two guards that read OUTSIDE the tree, and they disagree
# about failing open — deliberately.** Guard 4's oracle is the running service
# and its finding is about the PR's own content, so an unreachable oracle fails
# OPEN rather than becoming an unclearable merge blocker. Guard 5's failure is
# irreversible, so it fails CLOSED on everything, including a registry it cannot
# reach. Do not reconcile them; `scripts/lint-capture-floor.ts`'s header carries
# the comparison.
on:
  pull_request:
    branches:
      - main
      - sandbox
      - "sandbox/e2e-*"
  # ⚠️ **The `main` arm runs UNSCOPED, and that asymmetry is load-bearing.**
  # PRs block only on findings in the families they touch (see the blame step
  # below); if an untouched family's finding never blocked anyone, `main` would
  # drift red with nobody accountable. Scoped on PRs, unscoped on `main`, is the
  # split that keeps both properties — detection everywhere, blame where it
  # belongs.
  push:
    branches: [main]

# Per-PR group so a superseded push stops paying for a verdict nobody will read.
#
# Drafts here are long-lived open PRs that agents push to repeatedly and never
# merge; every push fired three workflows to completion. One branch
# (`draft/quote/cbf24103`) burned 75 billed minutes in a single week that way.
#
# ⚠️ **Distinct group name per workflow.** A group shared with `visual-diff` or
# `money-lint` would make them cross-cancel — one workflow's newer run killing
# another workflow's live one, so the surviving verdict is for a check that
# never ran. Same rule visual-diff.yml states for its own group.
#
# The key is the PR NUMBER on a PR and the SHA on a push. That fallback used to
# be unreachable — this was PR-triggered only — and was kept on the reasoning
# that it would make the group safe "if a `push:` arm is ever added". It has
# been: a push-to-main run now lands in a group of one and can never be
# cancelled by a later push, which is what a verdict on a commit that is
# permanently on `main` is worth.
#
# ⚠️ A cancelled run leaves the arm NOT-REPORTED on the superseded sha, not red.
# The authoritative verdict is the newest run on the HEAD sha — which is what
# branch protection evaluates.
concurrency:
  group: templates-lint-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  templates-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Needed for `git merge-base origin/<base> HEAD` in the blame step.
          # `visual-diff.yml` already checks out this way for the same reason.
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # 0. LOCKFILE SYNC — see the workflow header. FIRST, and a bare `deno run`.
      #
      # ⚠️ Do not "tidy" this into `deno task lint:lockfile`. There is no such
      # task on purpose (deno.json's `//lint:lockfile` explains), because the
      # task LAUNCHER syncs the lock before the inner --no-lock can take effect.
      #
      # ⚠️ Do not move it below any `deno task` step either. Its verdict is only
      # about the committed corpus while nothing has resolved the import map yet.
      #
      # Not blame-scoped: like the capture-floor guard it answers a question
      # about the REPOSITORY, not about a family, so scoping which findings block
      # would block on nothing, ever.
      - name: Check deno.json / deno.lock agreement
        run: deno run --no-lock --allow-read scripts/check-lockfile-sync.ts

      # ── Blame scoping — see scripts/affectedFamilies.ts ─────────────
      #
      # ⚠️ **Scopes the BLAME, never the SCAN.** `lint-fixtures.ts` walks every
      # family in every mode, and its own header says why: a `@cfs/core` bump or
      # a `collection_source` flip changes NO fixture file, and that is exactly
      # the drift it exists to catch. `beta.307` deleted
      # `DocumentOrganizationSnapshot.name` and all 23 fixtures stopped
      # satisfying their schemas at once while touching zero fixture files
      # (#187) — a changed-files-scoped SCAN would have passed that PR.
      #
      # What this decides is only which findings BLOCK. Its path table
      # deliberately DISAGREES with `visual-diff.yml`'s on four rows; the table
      # and the reasons are in `scripts/affectedFamilies.ts`. Do not reconcile
      # them — that is how #187 gets reintroduced.
      - name: Compute blame scope (PRs only)
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          BASE_SHA=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
          git diff --name-only "$BASE_SHA" HEAD > /tmp/changed-files.txt
          echo "Changed files:"; cat /tmp/changed-files.txt

      # Resolves @cfs/core from the committed lock, so the gate validates with the
      # same schema build the API enforces with. A lagging lock here would make the
      # gate pass while the API 422s — which is the exact drift it exists to catch.
      - name: Lint fixtures (schema + PII)
        run: |
          if [ -f /tmp/changed-files.txt ]; then
            deno task lint:fixtures --blame-changed-files=/tmp/changed-files.txt
          else
            deno task lint:fixtures
          fi

      # 3. CITATIONS — every backticked `path.ext` in this repo's prose still
      #    resolves. Rules are `@cfs/core/utils/citations`, shared with core,
      #    api-cloudrun and manager so the four repos cannot disagree about one
      #    citation.
      #
      #    ⚠️ **This job is a FLOOR, not the real check.** CI holds only this
      #    repo, and almost everything this repo's prose names lives in
      #    api-cloudrun — those citations report UNVERIFIABLE here rather than
      #    broken. Measured at landing: 1 broken in a full workspace, 0 in a CI
      #    checkout. Run `deno task lint:citations` locally, where the siblings
      #    are present, before trusting a green run here.
      - name: Lint citations
        run: deno task lint:citations

      # 3b. TIMEZONE — every date-fns call in an .eta must name Chicago on the
      #     PARSE as well as the FORMAT.
      #
      #     🔴 **This is the one arm here that no other environment can run.**
      #     Template content is canonical in THIS repo, so no ratchet in
      #     `api-cloudrun` or `core` can see any of it — the same argument
      #     `money-lint.yml` makes for itself.
      #
      #     ⚠️ And it guards a defect that is INVISIBLE to every local check:
      #     `deno task preview` runs on a Chicago laptop where the unpinned parse
      #     is accidentally correct, and the golden gate freezes whatever
      #     production renders — so once a wrong render is blessed, the gate
      #     DEFENDS it. A statement printed its period start a day early in prod
      #     for exactly this reason, and it surfaced only because two
      #     environments happened to disagree.
      #
      #     Whole-tree and argument-free by design; see `scripts/lint-dates.ts`.
      - name: Lint timezones
        run: deno task lint:dates

      # 4. DEPLOYED ENUMS — see the workflow header.
      #
      # ⚠️ **`--base` is what makes this check mean anything.** The env it
      # queries must be the env whose core will validate THIS merge: `main` →
      # prod, `sandbox*` → dev. Dev deploys continuously from api-cloudrun
      # `main`, so a dev check is satisfied the moment the core bump lands
      # there and can NEVER see this class — a `main` PR checked against dev
      # would pass while the merge it gates fails. On the push arm
      # `github.base_ref` is empty and the script defaults to prod, which is
      # the right oracle for a commit that is already on `main`.
      #
      # ⚠️ It fails OPEN on any inability to reach the oracle, printing
      # `COULD NOT VERIFY`. That is deliberate: this workflow is a REQUIRED
      # check on a product whose operators do not all have GitHub access, so a
      # network blip that went red would be an unclearable merge blocker whose
      # only repair is a repo edit they cannot make. It fails CLOSED only on a
      # positive finding, which is a fact about the PR's own content.
      - name: Lint deployed enums
        run: |
          if [ -f /tmp/changed-files.txt ]; then
            deno task lint:deployed-enums \
              --base="${{ github.base_ref || 'main' }}" \
              --blame-changed-files=/tmp/changed-files.txt
          else
            deno task lint:deployed-enums --base="${{ github.base_ref || 'main' }}"
          fi

      # 5. CAPTURE FLOOR — see the workflow header.
      #
      # ⚠️ **Deliberately NOT blame-scoped.** Every other guard here answers a
      # question about a FAMILY, so scoping which findings block is meaningful.
      # This one answers a question about the REPOSITORY — is capture-floor.json
      # still current — and that fact is the same whichever files a PR touches.
      # A blame-scoped run of it would block on nothing, ever.
      #
      # ⚠️ It fails CLOSED on an unreachable registry, unlike guard 4 above.
      # The trade is different because the failures are: a missed enum member
      # 500s the publish webhook and is re-runnable, a missed PII mask succeeds
      # quietly and writes customer data into git history. A blocked PR clears
      # on a re-run; a disclosure clears on nothing.
      - name: Lint capture floor
        run: deno task lint:capture-floor

      - name: Scan templates for hardcoded PII
        run: |
          deno run --allow-read - <<'TS'
          // Scan templates/**, layouts/** and partials/** for hardcoded customer PII.
          //
          // ⚠️ `partials/` was NOT scanned until 2026-08-26, and it had never
          // been — while money-lint has walked it all along. It is the worst
          // root to omit: `partials/shared/**` is owned by the `base` COMPONENT
          // and overlaid onto EVERY family, so one hardcoded line there ships on
          // every document at once. The file living there today carries the
          // company phone number, which only passes because it is allowlisted
          // below — the guard was never consulted about it.
          // Heuristics (starting point — see workflow header):
          //   - email addresses whose domain is NOT chicagofilmsupplies.com
          //   - US phone-number patterns: (312) 555-1212 / 312-555-1212 /
          //     312.555.1212 / +1 312 555 1212 / 3125551212
          const EMAIL = /[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/g;
          const PHONE =
            /(?:\+?1[\s.-]?)?(?:\(\d{3}\)[\s.-]?|\d{3}[\s.-])\d{3}[\s.-]?\d{4}|\b\d{10}\b/g;
          const ALLOWED_EMAIL_DOMAIN = "chicagofilmsupplies.com";
          // CFS's own business contact is a legitimate hardcoded constant (it's
          // the supplier's number, not customer PII). Allowlist its digits so
          // the company-info block in templates doesn't trip the guard. Add
          // more CFS lines here if they change.
          const ALLOWED_PHONE_DIGITS = new Set(["3128183008"]);

          const findings: string[] = [];
          async function* walk(dir: string): AsyncGenerator<string> {
            for await (const e of Deno.readDir(dir)) {
              const p = `${dir}/${e.name}`;
              if (e.isDirectory) yield* walk(p);
              else if (e.isFile && p.endsWith(".eta")) yield p;
            }
          }
          const roots: string[] = [];
          for (const d of ["templates", "layouts", "partials"]) {
            try { await Deno.stat(d); roots.push(d); } catch { /* absent */ }
          }
          for (const root of roots) {
            for await (const file of walk(root)) {
              const lines = (await Deno.readTextFile(file)).split("\n");
              lines.forEach((line, i) => {
                for (const m of line.matchAll(EMAIL)) {
                  const domain = m[0].split("@")[1]?.toLowerCase() ?? "";
                  if (domain !== ALLOWED_EMAIL_DOMAIN) {
                    findings.push(`${file}:${i + 1}  hardcoded email: ${m[0]}`);
                  }
                }
                for (const m of line.matchAll(PHONE)) {
                  const digits = m[0].replace(/\D/g, "").replace(/^1(?=\d{10}$)/, "");
                  if (ALLOWED_PHONE_DIGITS.has(digits)) continue;
                  findings.push(`${file}:${i + 1}  hardcoded phone: ${m[0]}`);
                }
              });
            }
          }
          if (findings.length) {
            console.error("Hardcoded PII found — pull contact info from it.doc instead:\n");
            for (const f of findings) console.error("  " + f);
            Deno.exit(1);
          }
          console.log("pii-lint: no hardcoded customer PII found.");
          TS

      # The unit arm. Today it is the lockfile guard's two polarities and
      # nothing else, and that is exactly why it exists: guard 0 runs against a
      # corpus that is nearly always right, so its silence means nothing unless
      # something has shown it can speak. It reads synthetic pairs, never the
      # real deno.lock (except for one ratchet arm), so it is order-independent
      # and safely last.
      - name: Unit tests
        run: deno task test
