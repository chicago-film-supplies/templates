name: templates-lint

# Three always-on guards on every PR.
#
# 1. FIXTURES (scripts/lint-fixtures.ts) — every fixtures/<gp>/*.json must satisfy
#    the same schema the API enforces on save, and carry no customer PII. Fixtures
#    used to be validated ONLY on the API's write path, so a fixture committed
#    straight to git bypassed the only gate there was: both quote fixtures sat
#    invalid in main for months, rendering fine, and only exploded when an operator
#    tried to save an edit — reporting a wall of failures they had not caused. One
#    of them was also a verbatim copy of a live customer's order.
#
# 2. TEMPLATES — .eta sources must pull contact info from `it.doc`, never hardcode
#    customer PII. A STARTING HEURISTIC: it catches the obvious cases (a literal
#    customer email or phone pasted into a template), not every conceivable PII
#    shape; tune the patterns as real false-positives/negatives surface.
on:
  pull_request:
    branches:
      - main
      - sandbox
      - "sandbox/e2e-*"

permissions:
  contents: read

jobs:
  templates-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Resolves @cfs/core from the committed lock, so the gate validates with the
      # same schema build the API enforces with. A lagging lock here would make the
      # gate pass while the API 422s — which is the exact drift it exists to catch.
      - name: Lint fixtures (schema + PII)
        run: deno task lint:fixtures

      # 3. CITATIONS — every backticked `path.ext` in this repo's prose still
      #    resolves. Rules are `@cfs/core/utils/citations`, shared with core,
      #    api-cloudrun and manager so the four repos cannot disagree about one
      #    citation.
      #
      #    ⚠️ **This job is a FLOOR, not the real check.** CI holds only this
      #    repo, and almost everything this repo's prose names lives in
      #    api-cloudrun — those citations report UNVERIFIABLE here rather than
      #    broken. Measured at landing: 1 broken in a full workspace, 0 in a CI
      #    checkout. Run `deno task lint:citations` locally, where the siblings
      #    are present, before trusting a green run here.
      - name: Lint citations
        run: deno task lint:citations

      - name: Scan templates for hardcoded PII
        run: |
          deno run --allow-read - <<'TS'
          // Scan templates/**/*.eta + layouts/**/*.eta for hardcoded customer PII.
          // Heuristics (starting point — see workflow header):
          //   - email addresses whose domain is NOT chicagofilmsupplies.com
          //   - US phone-number patterns: (312) 555-1212 / 312-555-1212 /
          //     312.555.1212 / +1 312 555 1212 / 3125551212
          const EMAIL = /[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/g;
          const PHONE =
            /(?:\+?1[\s.-]?)?(?:\(\d{3}\)[\s.-]?|\d{3}[\s.-])\d{3}[\s.-]?\d{4}|\b\d{10}\b/g;
          const ALLOWED_EMAIL_DOMAIN = "chicagofilmsupplies.com";
          // CFS's own business contact is a legitimate hardcoded constant (it's
          // the supplier's number, not customer PII). Allowlist its digits so
          // the company-info block in templates doesn't trip the guard. Add
          // more CFS lines here if they change.
          const ALLOWED_PHONE_DIGITS = new Set(["3128183008"]);

          const findings: string[] = [];
          async function* walk(dir: string): AsyncGenerator<string> {
            for await (const e of Deno.readDir(dir)) {
              const p = `${dir}/${e.name}`;
              if (e.isDirectory) yield* walk(p);
              else if (e.isFile && p.endsWith(".eta")) yield p;
            }
          }
          const roots: string[] = [];
          for (const d of ["templates", "layouts"]) {
            try { await Deno.stat(d); roots.push(d); } catch { /* absent */ }
          }
          for (const root of roots) {
            for await (const file of walk(root)) {
              const lines = (await Deno.readTextFile(file)).split("\n");
              lines.forEach((line, i) => {
                for (const m of line.matchAll(EMAIL)) {
                  const domain = m[0].split("@")[1]?.toLowerCase() ?? "";
                  if (domain !== ALLOWED_EMAIL_DOMAIN) {
                    findings.push(`${file}:${i + 1}  hardcoded email: ${m[0]}`);
                  }
                }
                for (const m of line.matchAll(PHONE)) {
                  const digits = m[0].replace(/\D/g, "").replace(/^1(?=\d{10}$)/, "");
                  if (ALLOWED_PHONE_DIGITS.has(digits)) continue;
                  findings.push(`${file}:${i + 1}  hardcoded phone: ${m[0]}`);
                }
              });
            }
          }
          if (findings.length) {
            console.error("Hardcoded PII found — pull contact info from it.doc instead:\n");
            for (const f of findings) console.error("  " + f);
            Deno.exit(1);
          }
          console.log("pii-lint: no hardcoded customer PII found.");
          TS
