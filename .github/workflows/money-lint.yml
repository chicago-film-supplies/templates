name: money-lint

# The templates arm of the cross-repo money ratchet.
#
# The three rules, the measurements behind them and the budgets live in
# `scripts/money-lint.ts`. They were a 200-line heredoc here until the ratchet
# was split by direction — two jobs cannot share a heredoc, and duplicating the
# scanner to get a second arm would have been two implementations of one rule.
#
# ## ⭐ Two jobs, because the ratchet's two directions are not the same failure
#
# | job | required | fails on |
# |---|---|---|
# | `money-lint`         | ✅ | a REGRESSION — new unguarded arithmetic, or an empty scan |
# | `money-lint-ratchet` | advisory | a CLEANUP the budget has not recorded yet |
#
# A budget ratchet fails in both directions on purpose. But the manager's
# template editor is a first-class authoring surface with **no GitHub escape** —
# operators do not all have access to this org — and the two arms differ in
# whether an operator can clear them:
#
#   - `count > budget` is new arithmetic in a `.eta`, repairable in CodeMirror.
#   - `count < budget` is repairable ONLY by editing `scripts/money-lint.ts`,
#     which the editor cannot open under any circumstance.
#
# So an operator who removes a raw-arithmetic site — the RIGHT thing to do —
# used to be told "budget 2 but only 1 site(s) remain — lower it to 1" by a
# check that was about to become merge-blocking, with no control they could
# reach. Splitting by direction moves that arm off the merge path and keeps the
# ratchet's teeth: `money-lint-ratchet` still goes RED (it exits 1), it is just
# not in `required_status_checks`.
#
# ## ⚠️ ONE concurrency group here is correct, and it is not the shared-group trap
#
# The rule the other workflows state — distinct group names, or they
# cross-cancel — is about distinct WORKFLOWS. These two jobs are in one
# workflow, so one group cancels one RUN containing both, which is what should
# happen: they are a verdict pair on a single sha, and cancelling half of a pair
# is how you get a surviving verdict for a check that never ran. Do not "fix"
# this into two groups.
#
# The key is the PR NUMBER on a PR and the SHA on a push, so a push-to-main run
# lands in a group of one and can never be cancelled by a later push: a verdict
# on a commit that is permanently on `main` is worth its whole minute.
#
# ⚠️ A cancelled run leaves the arm NOT-REPORTED on the superseded sha, not red.
# The authoritative verdict is the newest run on the HEAD sha — which is what
# branch protection evaluates.
on:
  pull_request:
    branches:
      - main
      - sandbox
      - "sandbox/e2e-*"
  push:
    branches: [main]

concurrency:
  group: money-lint-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── The required arm — regressions only ────────────────────────────
  money-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Needed for `git merge-base origin/<base> HEAD` in the blame step
          # below. `visual-diff.yml` already checks out this way for the same
          # reason; `templates-lint.yml` does now too.
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # ── Blame scoping — see scripts/affectedFamilies.ts ─────────────
      #
      # ⚠️ **This scopes the BLAME, never the SCAN.** The scanner walks every
      # `.eta` in every mode. What this file decides is only which findings
      # BLOCK: a pre-existing violation in a family this PR does not touch is
      # reported as a notice instead of reddening someone else's change.
      #
      # ⚠️ **On `push: main` there is no blame file, so the run is UNSCOPED** —
      # and that asymmetry is load-bearing. If an untouched family's finding
      # never blocks anyone, `main` drifts red with nobody accountable. Scoped
      # on PRs, unscoped on `main`, is the split that keeps both properties.
      - name: Compute blame scope (PRs only)
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          BASE_SHA=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
          git diff --name-only "$BASE_SHA" HEAD > /tmp/changed-files.txt
          echo "Changed files:"; cat /tmp/changed-files.txt

      - name: Scan templates for unguarded money arithmetic
        run: |
          if [ -f /tmp/changed-files.txt ]; then
            deno task lint:money --blame-changed-files=/tmp/changed-files.txt
          else
            deno task lint:money
          fi

  # ── The advisory arm — cleanups the budget owes ────────────────────
  #
  # Never blame-scoped: it blocks nothing, so partitioning it would only hide
  # half of a report whose entire purpose is to be read.
  money-lint-ratchet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check the money budgets against the code
        run: deno task lint:money:ratchet
