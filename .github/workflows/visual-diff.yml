name: visual-diff

# Golden visual-diff gate. For each changed template family, renders the PR's
# content via the API and pixel-compares against the committed golden for the
# PR's BASE branch. Required status check for branch protection (Phase 3 owns
# the full protection config).
on:
  pull_request:
    branches:
      - main
      - sandbox
      - "sandbox/e2e-*"

# WIF needs id-token write; contents read to diff changed files.
permissions:
  contents: read
  id-token: write

jobs:
  visual-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need the base ref to diff changed files

      # ── Per-env API + audience mapping ──────────────────────────────
      # The PR's BASE branch selects the env: `sandbox*` → dev API, `main` →
      # prod API. The minted ID token's audience MUST equal the target API's
      # GOLDEN_DIFF_AUDIENCE (= the API URL). API_URL_DEV / API_URL_PROD are
      # repo secrets (see infra/RUNBOOK-golden-diff.md).
      - name: Resolve target env
        id: env
        run: |
          # Base branch selects the env. Each env has its OWN WIF provider, CI
          # service account, and API URL/audience (dev → cfs-dev-3100, prod →
          # cfs-3100), so all three are per-env *_DEV/*_PROD repo secrets.
          BASE="${{ github.base_ref }}"
          if [ "$BASE" = "main" ]; then
            echo "api_url=${{ secrets.API_URL_PROD }}" >> "$GITHUB_OUTPUT"
            echo "wif_provider=${{ secrets.WIF_PROVIDER_PROD }}" >> "$GITHUB_OUTPUT"
            echo "golden_diff_sa=${{ secrets.GOLDEN_DIFF_SA_PROD }}" >> "$GITHUB_OUTPUT"
          else
            echo "api_url=${{ secrets.API_URL_DEV }}" >> "$GITHUB_OUTPUT"
            echo "wif_provider=${{ secrets.WIF_PROVIDER_DEV }}" >> "$GITHUB_OUTPUT"
            echo "golden_diff_sa=${{ secrets.GOLDEN_DIFF_SA_DEV }}" >> "$GITHUB_OUTPUT"
          fi

      # ── Detect changed template git_paths ───────────────────────────
      # A shared-asset change (layouts/base.eta, styles/base.css,
      # partials/shared/**) re-renders every family → diff all. Otherwise map
      # each changed templates/<gp>.eta | styles/<gp>.css | partials/<gp>/** |
      # fixtures/<gp>/<slug>.json to its git_path. (Mirrors api-cloudrun
      # src/services/templates/affected.ts; fixture-only changes go into the
      # `goldenOnly` bucket on the api side — same trigger here.)
      - name: Detect changed git_paths
        id: changed
        run: |
          set -euo pipefail
          BASE_SHA=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
          FILES=$(git diff --name-only "$BASE_SHA" HEAD)
          echo "Changed files:"; echo "$FILES"

          shared=0
          declare -A paths
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              layouts/base.eta|styles/base.css|partials/shared/*)
                shared=1 ;;
              templates/*.meta.json)
                : ;; # metadata-only — no render change
              templates/*.eta)
                gp="${f#templates/}"; gp="${gp%.eta}"
                [[ "$gp" == */* ]] || paths["$gp"]=1 ;;
              styles/*.css)
                gp="${f#styles/}"; gp="${gp%.css}"
                [[ "$gp" == */* || "$gp" == "base" ]] || paths["$gp"]=1 ;;
              partials/*)
                rest="${f#partials/}"; seg="${rest%%/*}"
                [ "$seg" != "shared" ] && paths["$seg"]=1 ;;
              fixtures/*)
                # fixtures/<gp>/<slug>.json — re-run that family's per-fixture
                # golden fan-out without bumping the template version.
                rest="${f#fixtures/}"; seg="${rest%%/*}"
                [[ "$rest" == */*.json ]] && paths["$seg"]=1 ;;
            esac
          done <<< "$FILES"

          if [ "$shared" = "1" ]; then
            # Shared change → every family (one per templates/*.meta.json).
            ALL=$(ls templates/*.meta.json 2>/dev/null | sed 's#templates/##;s#\.meta\.json##')
            for gp in $ALL; do paths["$gp"]=1; done
          fi

          GPS="${!paths[*]}"
          echo "git_paths=$GPS" >> "$GITHUB_OUTPUT"
          echo "Affected git_paths: $GPS"

      - name: Authenticate to GCP (WIF)
        if: steps.changed.outputs.git_paths != ''
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ steps.env.outputs.wif_provider }}
          service_account: ${{ steps.env.outputs.golden_diff_sa }}
          # Mint an ID token audience-scoped to the target API.
          token_format: id_token
          id_token_audience: ${{ steps.env.outputs.api_url }}
          id_token_include_email: true

      - name: Run golden diff per family
        if: steps.changed.outputs.git_paths != ''
        env:
          API_URL: ${{ steps.env.outputs.api_url }}
          ID_TOKEN: ${{ steps.auth.outputs.id_token }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -uo pipefail
          fail=0
          for gp in ${{ steps.changed.outputs.git_paths }}; do
            echo "::group::golden-diff: $gp"
            # head_branch lets the API persist the verdict onto the matching draft
            # version for the manager's approve-to-merge review (6.16).
            payload=$(jq -nc \
              --arg gp "$gp" --arg sha "$HEAD_SHA" --arg b "$BASE_REF" --arg hb "$HEAD_REF" \
              '{git_path:$gp, sha:$sha, branch:$b, head_branch:$hb}')

            # Retry-with-backoff to absorb Gotenberg cold start (B6). Only a
            # `renderer-unavailable` verdict (or transport error) is retried;
            # a real diff fails immediately.
            #
            # FIVE attempts, not three. Prod Gotenberg runs `minScale=0` with CPU
            # throttling, so it is warm during business hours from real document
            # renders and stone cold otherwise — and this gate runs on whatever
            # schedule a PR arrives. Measured 2026-08-17 at 23:12 Chicago on a
            # Saturday, the first run to ever reach a real verdict burned
            # attempts 1 and 2 (`HTTP 504` then `HTTP 503`) and succeeded on 3:
            # zero headroom. Every other run in the preceding sample was during
            # Thursday working hours and needed none. Attempts cost only CI
            # wall-clock on a path that is already asynchronous, and a
            # `renderer-unavailable` verdict is NOT a visual regression — it is a
            # non-answer, which is the worst outcome for a required status check.
            attempts=5
            verdict=""; body=""
            for attempt in $(seq 1 $attempts); do
              resp=$(curl -sS -m 180 -w '\n%{http_code}' \
                -H "Authorization: Bearer $ID_TOKEN" \
                -H "Content-Type: application/json" \
                -X POST "$API_URL/templates/golden-diff" \
                -d "$payload" || true)
              code=$(printf '%s' "$resp" | tail -n1)
              body=$(printf '%s' "$resp" | sed '$d')

              if [ "$code" = "200" ]; then
                verdict=$(printf '%s' "$body" | jq -r '.verdict')
                [ "$verdict" != "renderer-unavailable" ] && break
              else
                echo "HTTP $code: $body"
                verdict="renderer-unavailable"
              fi

              # Don't sleep after the LAST attempt — there is nothing left to
              # wait for, and the old loop burned a full backoff before giving up.
              [ "$attempt" -ge "$attempts" ] && break

              # 20s, 40s, 60s, 80s. The previous comment here claimed
              # "10s, 40s, 90s", which no arithmetic in this file produces.
              backoff=$((20 * attempt))
              echo "renderer unavailable (attempt $attempt) — retrying in ${backoff}s"
              sleep "$backoff"
            done

            # Top-level verdict is the aggregate over all fixtures (precedence:
            # renderer-unavailable → diff → no-golden → match). `.results[]`
            # carries the per-fixture detail used to surface candidate/diff
            # URLs on a real visual regression. `no-fixtures` is informational
            # — the family has no fixtures yet (capture one in the manager).
            case "$verdict" in
              match)
                echo "✓ $gp: match across $(printf '%s' "$body" | jq -r '.results | length') fixture(s)" ;;
              no-golden)
                echo "✓ $gp: no-golden — at least one fixture awaits its first bless"
                printf '%s' "$body" | jq -r '.results[] | select(.verdict=="no-golden") | "    bless: \(.fixture) → https://ucarecdn.com/\(.image_uuids.candidate)/"' ;;
              no-fixtures)
                echo "ℹ $gp: no-fixtures — capture a source doc in the manager to enable golden review" ;;
              diff)
                echo "✗ $gp: VISUAL REGRESSION across $(printf '%s' "$body" | jq -r '[.results[] | select(.verdict=="diff")] | length') fixture(s)"
                printf '%s' "$body" | jq -r '.results[] | select(.verdict=="diff") | "    \(.fixture) (delta=\(.delta))\n      candidate: https://ucarecdn.com/\(.image_uuids.candidate)/\n      diff:      https://ucarecdn.com/\(.image_uuids.diff)/"'
                fail=1 ;;
              renderer-unavailable|*)
                echo "✗ $gp: renderer unavailable after retries — NOT a visual regression; retry the job."
                fail=1 ;;
            esac
            echo "::endgroup::"
          done
          exit $fail
